<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d"><title id="t">@vaubaan/harness: project context as code</title><desc id="d">A meta database of Markdown files under docs/ points to the code database; the harness renders it for coding agents and lints it in CI.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#0E1215} .surface{fill:#161B20} .ink{fill:#E8ECEF} .muted{fill:#98A3AE} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#6FCBD3} .accentS{stroke:#6FCBD3} .accentSoft{fill:#143A3F} .accentInk{fill:#BFE8EB} .meta{fill:#12272A} .code{fill:#1B2127} .human{fill:#E6BE5C} .humanSoft{fill:#3A3014} .agent{fill:#A990F0} .agentSoft{fill:#27203F} .ok{fill:#5CC48A} .warn{fill:#E0B35A} .inkS{stroke:#E8ECEF} .mutedS{stroke:#98A3AE} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="0" y="0" width="1200" height="380" rx="24" class="bg line thin" /><rect x="64" y="60" width="479" height="32" rx="16.0" class="accentSoft"/><text x="303.5" y="81.04" font-size="14" text-anchor="middle" class="accentInk mono sb" xml:space="preserve" >npx -y @vaubaan/harness init . --engines=claude-code</text><text x="64" y="160" font-size="60" text-anchor="start" class="ink b" xml:space="preserve" >Project context</text><text x="64" y="226" font-size="60" text-anchor="start" class="accent b" xml:space="preserve" >as code.</text><text x="64" y="272" font-size="20" text-anchor="start" class="muted" xml:space="preserve" >A context database for your project, kept in the repo,</text><text x="64" y="302" font-size="20" text-anchor="start" class="muted" xml:space="preserve" >rendered for your coding agents, linted in CI.</text><rect x="700" y="56" width="190" height="230" rx="16" class="surface line thin" /><rect x="700" y="56" width="190" height="40" rx="16" class="meta"/><rect x="700" y="80" width="190" height="16" class="meta"/><text x="718" y="82" font-size="15" text-anchor="start" class="ink b" xml:space="preserve" >docs/   meta database</text><text x="718" y="122" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >spec/</text><text x="718" y="148" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >decisions/</text><text x="718" y="174" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >handbook/</text><text x="718" y="200" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >tests/</text><text x="718" y="226" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >workflow/</text><text x="718" y="252" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >intents/</text><rect x="980" y="56" width="156" height="230" rx="16" class="surface line thin" /><rect x="980" y="56" width="156" height="40" rx="16" class="code"/><rect x="980" y="80" width="156" height="16" class="code"/><text x="998" y="82" font-size="15" text-anchor="start" class="ink b" xml:space="preserve" >code database</text><text x="998" y="122" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >src/</text><text x="998" y="148" font-siz