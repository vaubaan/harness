<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d"><title id="t">What the agent does with what the user asks</title><desc id="d">A decision tree: a question is answered from the docs; a visible change starts with a proposed intent and spec vocabulary; a costly choice starts with an ADR; everything ends with update, lint and the team workflow.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#0E1215} .surface{fill:#161B20} .ink{fill:#E8ECEF} .muted{fill:#98A3AE} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#6FCBD3} .accentS{stroke:#6FCBD3} .accentSoft{fill:#143A3F} .accentInk{fill:#BFE8EB} .meta{fill:#12272A} .code{fill:#1B2127} .human{fill:#E6BE5C} .humanSoft{fill:#3A3014} .agent{fill:#A990F0} .agentSoft{fill:#27203F} .ok{fill:#5CC48A} .warn{fill:#E0B35A} .inkS{stroke:#E8ECEF} .mutedS{stroke:#98A3AE} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="24" class="bg line thin" /><rect x="290" y="40" width="260" height="48" rx="14" class="humanSoft line thin" /><text x="420.0" y="70.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >The user asks for something</text><path d="M420 90 L420 118" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M420 118.0 L570.0 160 L420 202.0 L270.0 160z" class="accentSoft accentS thin"/><text x="420" y="158" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >A question,</text><text x="420" y="176" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >not a request for change?</text><path d="M270 160 L262 160" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="245" y="150" font-size="12" text-anchor="middle" class="muted sb" xml:space="preserve" >yes</text><rect x="60" y="128" width="200" height="64" rx="14" class="surface line thin" /><text x="160.0" y="156.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >Answer from the docs</text><text x="160.0" y="178.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >report the gap, invent nothing</text><path d="M420 202 L420 232" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="434" y="222" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >no</text><path d="M420 232.0 L580.0 274 L420 316.0 L260.0 274z" class="accentSoft accentS thin"/><text x="420" y="272" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >Does the behavior visible</text><text x="420" y="290" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >to the user change?</text><path d="M580 274 L900 274 L900 396" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="610" y="264" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >no</text><path d="M420 316 L420 346" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="434" y="336" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >yes</text><path d="M420 346.0 L580.0 388 L420 430.0 L260.0 388z" class="accentSoft accentS thin"/><text x="420" y="386" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >Does a proposed intent</text><text x="420" y="404" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >already exist?</text><path d="M580 388 L870 388" class="nofill mutedS mid"/><text x="610" y="378" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >yes</text><path d="M420 430 L420 460" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="434" y="450" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >no</text><path d="M420 460.0 L580.0 502 L420 544.0 L260.0 502z" class="accentSoft accentS thin"/><text x="420" y="500" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >Are the words in the</text><text x="420" y="518" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >spec Vocabulary?</text><path d="M260 502 L262 502" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="235" y="492" font-size="12" text-anchor="middle" class="muted sb" xml:space="preserve" >no</text><rect x="60" y="470" width="200" height="64" rx="14" class="surface line thin" /><text x="160.0" y="498.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >/spec first</text><text x="160.0" y="520.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >define the word</text><path d="M160 534 L160 600 L268 600" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M420 544 L420 568" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="434" y="560" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >yes</text><rect x="270" y="570" width="300" height="60" rx="14" class="accentSoft line thin" /><text x="420.0" y="596.0" font-size="16" text-anchor="middle" class="accentInk b" xml:space="preserve" >/intent &lt;verb + object&gt;</text><text x="420.0" y="618.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >a proposed intent with acceptance criteria, no code</text><path d="M570 600 L700 600 L700 440 L758 440" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="600" y="590" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >the user validates</text><path d="M900 398.0 L1040.0 440 L900 482.0 L760.0 440z" class="accentSoft accentS thin"/><text x="900" y="438" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >A structural choice,</text><text x="900" y="456" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >costly to reverse?</text><path d="M900 482 L900 510" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="914" y="500" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >yes</text><rect x="770" y="512" width="260" height="48" rx="14" class="surface line thin" /><text x="900.0" y="542.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >/decision before the code</text><path d="M900 560 L900 586" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M1040 440 L1130 440 L1130 626 L1042 626" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="1060" y="430" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >no</text><path d="M900 588.0 L1020.0 626 L900 664.0 L780.0 626z" class="accentSoft accentS thin"/><text x="900" y="631" font-size="14" text-anchor="middle" class="accentInk b" xml:space="preserve" >An intent to deliver?</text><path d="M780 626 L685 626 L685 690" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="760" y="616" font-size="12" text-anchor="end" class="muted sb" xml:space="preserve" >yes</text><rect x="520" y="692" width="330" height="56" rx="14" class="agentSoft line thin" /><text x="685.0" y="716.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >Code + tests titled after the criteria</text><text x="685.0" y="738.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >intent → implemented with anchors</text><path d="M900 664 L900 680 L1011 680 L1011 690" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="912" y="678" font-size="12" text-anchor="start" class="muted sb" xml:space="preserve" >no</text><rect x="870" y="692" width="282" height="56" rx="14" class="agentSoft line thin" /><text x="1011.0" y="716.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >Code + regression test</text><text x="1011.0" y="738.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >handbook and pointers if needed</text><rect x="60" y="692" width="440" height="56" rx="14" class="surface line thin" /><text x="280.0" y="716.0" font-size="16" text-anchor="middle" class="ink b" xml:space="preserve" >update .  →  lint  →  follow docs/workflow</text><text x="280.0" y="738.0" font-size="13" text-anchor="middle" class="muted" xml:space="preserve" >every path ends here</text><path d="M518 720 L502 720" class="nofill mutedS mid" marker-end="url(#m-muted)"/></svg>