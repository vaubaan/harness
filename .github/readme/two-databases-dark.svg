<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d"><title id="t">Two personas, one codebase, two databases</title><desc id="d">You and your coding agents share one repository that holds a code database and a meta database; the harness is the schema, constraints and views of the meta database.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#0E1215} .surface{fill:#161B20} .ink{fill:#E8ECEF} .muted{fill:#98A3AE} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#6FCBD3} .accentS{stroke:#6FCBD3} .accentSoft{fill:#143A3F} .accentInk{fill:#BFE8EB} .meta{fill:#12272A} .code{fill:#1B2127} .human{fill:#E6BE5C} .humanSoft{fill:#3A3014} .agent{fill:#A990F0} .agentSoft{fill:#27203F} .ok{fill:#5CC48A} .warn{fill:#E0B35A} .inkS{stroke:#E8ECEF} .mutedS{stroke:#98A3AE} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="0" y="0" width="1200" height="540" rx="24" class="bg line thin" /><circle cx="96" cy="150" r="22" class="human"/><circle cx="96" cy="144" r="7" class="surface"/><path d="M84 164 a12 10 0 0 1 24 0z" class="surface"/><text x="132" y="148" font-size="20" text-anchor="start" class="ink b" xml:space="preserve" >You</text><text x="132" y="170" font-size="15" text-anchor="start" class="muted" xml:space="preserve" >decide · validate · merge</text><circle cx="96" cy="330" r="22" class="agent"/><circle cx="96" cy="324" r="7" class="surface"/><path d="M84 344 a12 10 0 0 1 24 0z" class="surface"/><text x="132" y="328" font-size="20" text-anchor="start" class="ink b" xml:space="preserve" >Your coding agents</text><text x="132" y="350" font-size="15" text-anchor="start" class="muted" xml:space="preserve" >write docs and code, with judgment</text><rect x="420" y="64" width="716" height="330" rx="22" class="surface line thin" /><text x="444" y="98" font-size="16" text-anchor="start" class="muted mono" xml:space="preserve" >one repository</text><rect x="444" y="120" width="270" height="240" rx="16" class="surface line thin" /><rect x="444" y="120" width="270" height="40" rx="16" class="code"/><rect x="444" y="144" width="270" height="16" class="code"/><text x="462" y="146" font-size="15" text-anchor="start" class="ink b" xml:space="preserve" >code database</text><text x="462" y="186" font-size="16" text-anchor="start" class="ink mono" xml:space="preserve" >src/</text><text x="462" y="213" font-size="16" text-anchor="start" class="ink mono" xml:space="preserve" >tests/</text><text x="462" y="240" font-size="16" text-anchor="start" class="ink mono" xml:space="preserve" >configs</text><text x="462" y="267" font-size="16" text-anchor="start" class="ink mono" xml:space="preserve" >ci.yml</text><text x="579" y="342" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >what the machine runs</text><rect x="842" y="120" width="270" height="240" rx="16" class="surface line thin" /><rect x="842" y="120" width="270" height="40" rx="16" class="meta"/><rect x="842" y="144" width="270" height="16" class="meta"/><text x="860" y="146" font-size="15" text-anchor="start" class="ink b" xml:space="preserve" >meta database   docs/</text><text x="860" y="186" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >spec/   decisions/   handbook/</text><text x="860" y="212" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >tests/   workflow/   intents/</text><text x="860" y="238" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" ></text><text x="860" y="264" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >AGENTS.md  .claude/  .agents/</text><text x="860" y="290" font-size="15" text-anchor="start" class="ink mono" xml:space="preserve" >(rendered views, committed)</text><text x="977" y="342" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >what the code cannot say</text><path d="M842 234 L716 234" class="nofill accentS mid" marker-end="url(#m-accent)"/><text x="778" y="220" font-size="12" text-anchor="middle" class="accentInk sb" xml:space="preserve" >tracks · anchors</text><text x="778" y="258" font-size="12" text-anchor="middle" class="accentInk sb" xml:space="preserve" >realized by</text><path d="M330 150 L418 150" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M420 150 L332 150" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M330 330 L418 330" class="nofill mutedS mid" marker-end="url(#m-muted)"/><path d="M420 330 L332 330" class="nofill mutedS mid" marker-end="url(#m-muted)"/><rect x="420" y="440" width="716" height="56" rx="28" class="accentSoft accentS thin" /><text x="448" y="475" font-size="20" text-anchor="start" class="accentInk b" xml:space="preserve" >harness</text><text x="550" y="475" font-size="14" text-anchor="start" class="accentInk mono" xml:space="preserve" >schema: the pillars  ·  constraints: 19 linters  ·  views: update .</text><path d="M977 440 L977 364" class="nofill accentS mid dash" marker-end="url(#m-accent)"/><text x="963" y="420" font-size="13" text-anchor="end" class="muted" xml:space="preserve" >keeps the meta database consistent</text><text x="963" y="436" font-size="13" text-anchor="end" class="muted" xml:space="preserve" >with itself and with the code</text></svg>