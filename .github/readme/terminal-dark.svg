<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">init, then lint</title><desc id="d">Terminal: init renders 20 files; lint reports a drift warning on a handbook and names the skill that fixes it; CI passes.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#0E1215} .surface{fill:#161B20} .ink{fill:#E8ECEF} .muted{fill:#98A3AE} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#6FCBD3} .accentS{stroke:#6FCBD3} .accentSoft{fill:#143A3F} .accentInk{fill:#BFE8EB} .meta{fill:#12272A} .code{fill:#1B2127} .human{fill:#E6BE5C} .humanSoft{fill:#3A3014} .agent{fill:#A990F0} .agentSoft{fill:#27203F} .ok{fill:#5CC48A} .warn{fill:#E0B35A} .inkS{stroke:#E8ECEF} .mutedS{stroke:#98A3AE} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="64" y="40" width="1072" height="320" rx="18" class="term line thin" /><circle cx="92" cy="66" r="6" fill="#FF5F57"/><circle cx="114" cy="66" r="6" fill="#FEBC2E"/><circle cx="136" cy="66" r="6" fill="#28C840"/><text x="600" y="71" font-size="13" text-anchor="middle" class="termMuted mono" xml:space="preserve" >acme-billing</text><text x="96" y="112" font-size="15" text-anchor="start" class="termInk mono" xml:space="preserve" >$ npx -y @vaubaan/harness init . --engines=claude-code</text><text x="96" y="136" font-size="15" text-anchor="start" class="termMuted mono" xml:space="preserve" >rendered 20 files to .</text><text x="96" y="160" font-size="15" text-anchor="start" class="termMuted mono" xml:space="preserve" >next: commit the generated files, then run `npx @vaubaan/harness lint` before each commit</text><text x="96" y="208" font-size="15" text-anchor="start" class="termInk mono" xml:space="preserve" >$ npx @vaubaan/harness lint</text><text x="96" y="232" font-size="15" text-anchor="start" class="warn mono" xml:space="preserve" >docs/handbook/invoice-pipeline.md: warning[lint:tracks-drift]</text><text x="96" y="256" font-size="15" text-anchor="start" class="termMuted mono" xml:space="preserve" >  tracked files changed 12 times since last_reviewed (threshold 10)</text><text x="96" y="280" font-size="15" text-anchor="start" class="termMuted mono" xml:space="preserve" >  → Try: /handbook</text><text x="96" y="328" font-size="15" text-anchor="start" class="ok mono" xml:space="preserve" >0 errors, 1 warning. ✔ CI passes.</text></svg>