<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d"><title id="t">How the harness works</title><desc id="d">docs/ is rendered into AGENTS.md and the engine folders; agents read it and write code and docs; the linter runs in pre-commit and CI and fails when context and code disagree.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#66707C} .line{stroke:#D6DBE1} .lineF{fill:#D6DBE1} .accent{fill:#0F6E7A} .accentS{stroke:#0F6E7A} .accentSoft{fill:#DDEFEE} .accentInk{fill:#0B4F58} .meta{fill:#EEF6F5} .code{fill:#F1F2F4} .human{fill:#E9B949} .humanSoft{fill:#FBF1D6} .agent{fill:#8A6FD8} .agentSoft{fill:#EDE8FA} .ok{fill:#2E8B57} .warn{fill:#B7791F} .inkS{stroke:#1B2128} .mutedS{stroke:#66707C} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1} @media (prefers-color-scheme: dark){.bg{fill:#0E1215} .surface{fill:#161B20} .ink{fill:#E8ECEF} .muted{fill:#98A3AE} .line{stroke:#2A333B} .lineF{fill:#2A333B} .accent{fill:#6FCBD3} .accentS{stroke:#6FCBD3} .accentSoft{fill:#143A3F} .accentInk{fill:#BFE8EB} .meta{fill:#12272A} .code{fill:#1B2127} .human{fill:#E6BE5C} .humanSoft{fill:#3A3014} .agent{fill:#A990F0} .agentSoft{fill:#27203F} .ok{fill:#5CC48A} .warn{fill:#E0B35A} .inkS{stroke:#E8ECEF} .mutedS{stroke:#98A3AE} .term{fill:#0B0E11} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="0" y="0" width="1200" height="300" rx="24" class="bg line thin" /><rect x="64" y="76" width="232" height="120" rx="18" class="meta line thin" /><text x="180.0" y="116" font-size="19" text-anchor="middle" class="ink b" xml:space="preserve" >docs/</text><text x="180.0" y="146" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >your context,</text><text x="180.0" y="166" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >in Markdown</text><path d="M298 136.0 L342 136.0" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="320.0" y="64" font-size="12" text-anchor="middle" class="muted sb" xml:space="preserve" >init · update</text><rect x="344" y="76" width="232" height="120" rx="18" class="accentSoft line thin" /><text x="460.0" y="116" font-size="19" text-anchor="middle" class="ink b" xml:space="preserve" >rendered views</text><text x="460.0" y="146" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >AGENTS.md · .claude/</text><text x="460.0" y="166" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >.agents/ · .opencode/</text><path d="M578 136.0 L622 136.0" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="600.0" y="64" font-size="12" text-anchor="middle" class="muted sb" xml:space="preserve" >read</text><rect x="624" y="76" width="232" height="120" rx="18" class="agentSoft line thin" /><text x="740.0" y="116" font-size="19" text-anchor="middle" class="ink b" xml:space="preserve" >your coding agents</text><text x="740.0" y="146" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >Claude Code · Codex · OpenCode</text><text x="740.0" y="166" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >same context, write the code</text><path d="M858 136.0 L902 136.0" class="nofill mutedS mid" marker-end="url(#m-muted)"/><text x="880.0" y="64" font-size="12" text-anchor="middle" class="muted sb" xml:space="preserve" >code and docs</text><rect x="904" y="76" width="232" height="120" rx="18" class="surface line thin" /><text x="1020.0" y="116" font-size="19" text-anchor="middle" class="ink b" xml:space="preserve" >vaubaan-harness lint</text><text x="1020.0" y="146" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >pre-commit and CI</text><text x="1020.0" y="166" font-size="14" text-anchor="middle" class="muted" xml:space="preserve" >zero tokens</text><path d="M1020.0 198 L1020.0 244 L180.0 244 L180.0 200" class="nofill accentS mid dash" marker-end="url(#m-accent)"/><text x="600.0" y="268" font-size="14" text-anchor="middle" class="accentInk sb" xml:space="preserve" >fails when the context and the code disagree: the agent sees a failed command and fixes it</text></svg>