<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d"><title id="t">The intents pillar, read as an OKR tree</title><desc id="d">An intent file is a tree: level-1 intent, sub-intents, terminal intents carrying anchors or acceptance criteria; it reads like an OKR tree whose progress is computed from the repo.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace} .b{font-weight:600} .sb{font-weight:500} .thin{stroke-width:1.5} .mid{stroke-width:2} .dash{stroke-dasharray:6 6} .nofill{fill:none}.bg{fill:#FBFBF9} .surface{fill:#FFFFFF} .ink{fill:#1B2128} .muted{fill:#66707C} .line{stroke:#D6DBE1} .lineF{fill:#D6DBE1} .accent{fill:#0F6E7A} .accentS{stroke:#0F6E7A} .accentSoft{fill:#DDEFEE} .accentInk{fill:#0B4F58} .meta{fill:#EEF6F5} .code{fill:#F1F2F4} .human{fill:#E9B949} .humanSoft{fill:#FBF1D6} .agent{fill:#8A6FD8} .agentSoft{fill:#EDE8FA} .ok{fill:#2E8B57} .warn{fill:#B7791F} .inkS{stroke:#1B2128} .mutedS{stroke:#66707C} .term{fill:#15191D} .termInk{fill:#E6EAEE} .termMuted{fill:#8B96A1}</style><defs><marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="muted"/></marker><marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accent"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ink"/></marker></defs><rect x="0" y="0" width="1200" height="470" rx="24" class="bg line thin" /><text x="64" y="72" font-size="15" text-anchor="start" class="muted mono" xml:space="preserve" >docs/intents/send-an-invoice.md</text><rect x="64" y="92" width="330" height="54" rx="14" class="accentSoft accentS thin" /><text x="82" y="118" font-size="20" text-anchor="start" class="accentInk b" xml:space="preserve" >Send an invoice</text><text x="82" y="138" font-size="13" text-anchor="start" class="accentInk" xml:space="preserve" >level-1 intent · actors: accountant</text><path d="M92 146 L92 202 L102 202" class="nofill mutedS thin"/><rect x="104" y="180" width="236" height="44" rx="12" class="surface line thin" /><text x="120" y="208" font-size="17" text-anchor="start" class="ink b" xml:space="preserve" >Issue the invoice</text><path d="M92 146 L92 362 L102 362" class="nofill mutedS thin"/><rect x="104" y="340" width="236" height="44" rx="12" class="surface line thin" /><text x="120" y="368" font-size="17" text-anchor="start" class="ink b" xml:space="preserve" >Void an issued invoice</text><path d="M340 202 L352 202 L352 209 L362 209" class="nofill mutedS thin"/><rect x="364" y="180" width="380" height="58" rx="12" class="surface line thin "/><text x="382" y="204" font-size="17" text-anchor="start" class="ink b" xml:space="preserve" >Freeze the draft</text><rect x="548.0" y="188" width="93" height="22" rx="11.0" class="accentSoft"/><text x="594.5" y="203.32" font-size="12" text-anchor="middle" class="accentInk sb" xml:space="preserve" >implemented</text><text x="382" y="226" font-size="11" text-anchor="start" class="muted mono" xml:space="preserve" >anchors: src/invoicing/issue.ts · issue.test.ts</text><path d="M340 202 L352 202 L352 279 L362 279" class="nofill mutedS thin"/><rect x="364" y="250" width="380" height="58" rx="12" class="surface line thin dash"/><text x="382" y="274" font-size="17" text-anchor="start" class="ink b" xml:space="preserve" >Email the invoice</text><rect x="557.5" y="258" width="73" height="22" rx="11.0" class="humanSoft"/><text x="594.0" y="273.32" font-size="12" text-anchor="middle" class="ink sb" xml:space="preserve" >proposed</text><text x="382" y="296" font-size="11" text-anchor="start" class="muted mono" xml:space="preserve" >acceptance: the customer receives a PDF in a minute</text><path d="M340 362 L352 362 L352 369 L362 369" class="nofill mutedS thin"/><rect x="364" y="340" width="380" height="58" rx="12" class="surface line thin "/><text x="382" y="364" font-size="17" text-anchor="start" class="ink b" xml:space="preserve" >Void, never delete</text><rect x="567.0" y="348" width="93" height="22" rx="11.0" class="accentSoft"/><text x="613.5" y="363.32" font-size="12" text-anchor="middle" class="accentInk sb" xml:space="preserve" >implemented</text><text x="382" y="386" font-size="11" text-anchor="start" class="muted mono" xml:space="preserve" >anchors: src/invoicing/void.ts</text><rect x="764" y="92" width="372" height="296" rx="18" class="surface line thin" /><text x="788" y="126" font-size="19" text-anchor="start" class="ink b" xml:space="preserve" >Read it as an OKR tree</text><text x="788" y="164" font-size="15" text-anchor="start" class="accentInk b" xml:space="preserve" >Objective</text><text x="788" y="184" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve" >an intent: verb + object, for an actor, at every level</text><text x="788" y="216" font-size="15" text-anchor="start" class="accentInk b" xml:space="preserve" >Key results</text><text x="788" y="236" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve" >the acceptance: lines of a proposed terminal intent</text><text x="788" y="268" font-size="15" text-anchor="start" class="accentInk b" xml:space="preserve" >Initiatives</text><text x="788" y="288" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve" >the anchors: the code and tests that realize it</text><text x="788" y="320" font-size="15" text-anchor="start" class="accentInk b" xml:space="preserve" >Progress</text><text x="788" y="340" font-size="12.5" text-anchor="start" class="muted" xml:space="preserve" >share of implemented terminal intents, read from git</text><text x="788" y="378" font-size="13" text-anchor="start" class="muted" xml:space="preserve" >Send an invoice</text><rect x="904" y="366" width="160" height="14" rx="7" class="lineF"/><rect x="904" y="366" width="107" height="14" rx="7" class="accent"/><text x="1112" y="378" font-size="13" text-anchor="end" class="ink mono" xml:space="preserve" >2 / 3</text><text x="64" y="426" font-size="14" text-anchor="start" class="muted" xml:space="preserve" >A proposed intent is decided and not delivered: the backlog. The pull request that delivers it adds anchors and removes acceptance;</text><text x="64" y="446" font-size="14" text-anchor="start" class="muted" xml:space="preserve" >tests titled after the criteria carry them from then on.</text></svg>